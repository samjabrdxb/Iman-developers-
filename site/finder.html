:root{

  --f-display:"Marcellus","IBM Plex Sans Arabic",Georgia,serif;
  --f-body:"Figtree","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --green:#16301f; --green-2:#1f3e2b; --copper:#d79e85; --copper-ink:#e2ad95;
  --bg:#0e1712; --surface:#15211a; --ink:#e6ece6; --muted:#9fb0a4; --line:#26362c; --chip:#1d2b22;
  --on-green:#eef3ee; --on-green-muted:#a9bcae; --ok:#8fcfa4; --warn:#e2ad95; color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#16301f; --green-2:#1f3e2b; --copper:#d79e85; --copper-ink:#e2ad95;
  --bg:#0e1712; --surface:#15211a; --ink:#e6ece6; --muted:#9fb0a4; --line:#26362c; --chip:#1d2b22;
  --on-green:#eef3ee; --on-green-muted:#a9bcae; --ok:#8fcfa4; --warn:#e2ad95; color-scheme:dark}
[dir="rtl"]{--f-display:"IBM Plex Sans Arabic",Georgia,serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{background:var(--green);color:var(--on-green);padding-block:16px 30px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:"Marcellus",serif;color:var(--copper);letter-spacing:.38em;font-size:17px;line-height:1}
.logo small{display:block;font-size:7.5px;letter-spacing:.6em;margin-top:4px}
.lang{background:transparent;border:1px solid var(--on-green-muted);color:var(--on-green);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:16px}
.hero h1{font-size:clamp(26px,6.5vw,36px)}
.hero p{color:var(--on-green-muted);margin:4px 0 0;font-size:14px;max-width:44ch}
.me{display:flex;align-items:center;gap:10px;background:var(--green-2);border-radius:12px;padding:7px 12px 7px 7px;max-width:100%}
.me img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:2px solid var(--copper);flex:none}
.me div{line-height:1.3;font-size:13px}
.me b{font-size:14px}
.og{display:inline-block;border:1px solid var(--copper);color:var(--copper);border-radius:99px;padding:0 6px;font-size:10px;font-weight:800;letter-spacing:.06em;margin-inline-start:5px;vertical-align:1px}
.me span{color:var(--on-green-muted)}
.me a{color:var(--on-green);font-weight:700;text-decoration:none}

.note{background:var(--copper);color:#1b120d;border-radius:12px;padding:10px 14px;margin-top:-18px;position:relative;font-weight:700;display:flex;gap:10px;align-items:baseline}
.note b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;flex:none}
.note+.panel{margin-top:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;margin-top:-18px;position:relative;display:grid;gap:14px;box-shadow:0 10px 28px -20px rgba(0,0,0,.4)}
.panel>*{min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center}
.ph b{font-size:13px;color:var(--muted);font-weight:600}
.reset{border:0;background:transparent;color:var(--copper-ink);font-weight:700;font-size:13px;padding:2px 0}
.q{display:grid;gap:7px;min-width:0}
.ql{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--copper-ink)}
[dir="rtl"] .ql{letter-spacing:0;font-size:13px}
.money{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding-inline:12px}
.money:focus-within{border-color:var(--copper)}
.money span{color:var(--muted);font-weight:700;font-size:14px}
.money input{flex:1;min-width:0;width:100%;border:0;background:transparent;font:600 20px var(--f-body);color:var(--ink);padding:9px 8px;font-variant-numeric:tabular-nums;outline:none}
.money button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-size:14px;font-weight:700;text-align:start;line-height:1.25}
.chip small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.chip i{font-style:normal;font-weight:600;color:var(--muted);margin-inline-start:5px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.chip[aria-pressed="true"] small,.chip[aria-pressed="true"] i{color:var(--on-green-muted)}
.chip.zero:not([aria-pressed="true"]){opacity:.42}
.chip.sm{border-radius:99px;padding:4px 11px;font-size:13px}

.rbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-top:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rbar h2{font-size:21px}
.rbar .sub{font-size:12.5px;color:var(--muted)}
.rbar .r{display:flex;gap:6px;align-items:center}
.rbar select{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-size:13px;font-weight:600}
.edit{border:1.5px solid var(--green);background:var(--surface);color:var(--green);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700}
:root[data-theme="dark"] .edit{color:var(--ink);border-color:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .edit{color:var(--ink);border-color:var(--line)}}

.list{display:grid;gap:10px;padding-block:12px}
.sec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--warn);margin-top:8px}
[dir="rtl"] .sec{letter-spacing:0;font-size:13px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0}
.row1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.row1>div{min-width:0}
.eb{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--copper-ink)}
[dir="rtl"] .eb{letter-spacing:0;font-size:12.5px}
.uh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.uh h3{font-size:24px}
.ut{font-weight:700}
.price{text-align:end;flex:none}
.price .k{font-size:11.5px;color:var(--muted);font-weight:600}
.price .v{font-family:"Marcellus",var(--f-body);font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.price s{font-size:12px;color:var(--muted)}
.meta{color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:3px 12px}
.meta b{color:var(--ink);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--chip)}
.pill.cash{background:var(--green);color:var(--on-green)}
.pill.comm{color:var(--ok)}
.pill.warn{color:var(--warn)}
details{border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--copper-ink);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +"}
details[open] summary::after{content:" −"}
.sch{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;margin-top:6px}
.sch td{padding:4px 0;border-top:1px solid var(--line)}

.sch td:last-child{text-align:end;font-weight:700;white-space:nowrap}
.sch tr.tot td{font-weight:800;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1.5px solid var(--green);background:transparent;color:var(--green);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.foot{color:var(--muted);font-size:12.5px;padding-block:10px 28px;border-top:1px solid var(--line)}
.foot b{color:var(--ink)}
dialog{border:0;border-radius:var(--r);padding:0;max-width:min(680px,94vw);width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:var(--shade)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.dh button{border:0;background:var(--chip);border-radius:99px;width:32px;height:32px;font-size:18px}
dialog img{display:block;width:100%;height:auto;background:#fff}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:fit-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:9}
@media (max-width:440px){.price .v{font-size:18px}.uh h3{font-size:21px}}
</style>

  floor:"Floor",sqft:"sq ft",handover:"Handover",
  foot:"Prices in AED from IMAN's latest availability lists. Instalments are worked out on the discounted price. Prices, availability and offers are confirmed at booking; DLD and registration fees are extra.",
  waMsg:(u,p)=>"Hi Sam, is unit "+u+" at "+p+" still available? I have a client for it."},
 ar:{dir:"rtl",other:"English",h1:"لاقي الوحدة المناسبة لعميلك",noteL:"اليوم",sub:"كل وحدات إيمان المتاحة اليوم، حسب طلب عميلك.",
  role:"Senior Sales Manager",ask:"طلب العميل",reset:"مسح الكل",budget:"الميزانية",loc:"المنطقة",plan:"طريقة الدفع",beds:"عدد الغرف",
  any:"الكل",cash:"كاش كامل",clear:"مسح",upTo:"لحد ",
  planHint:{"40/60":"40% قبل التسليم","50/50":"50% قبل التسليم",cash:"أعلى خصم"},
  locs:{sufouh:["الصفوح","113 Residences"],jvc:["JVC","Oxford Cove"],motorcity:["موتور سيتي","Sierra by Iman"]},
  bedsL:{0:"ستوديو",1:"غرفة",2:"غرفتين",3:"3 غرف",4:"4 غرف",r:"محل تجاري"},
  n:k=>k===1?"وحدة":k+" وحدات",none:"ما في وحدة بتناسب كل هالاختيارات.",showCheapest:(v)=>"ارفع الميزانية لـ AED "+v,
  anyBudget:"بدون ميزانية",near:"فوق الميزانية بشوي (لحد 10%)",asof:d=>"المتاح بتاريخ "+d,
  sort:{price:"السعر: من الأرخص",priceD:"السعر: من الأغلى",size:"المساحة: الأكبر أول"},edit:"الفلتر",
  planP:p=>"خطة "+p,cashP:"كاش كامل",off:d=>"خصم "+d+"%",list:"الأصلي",
  onlyCash:"بتناسب الميزانية بالكاش بس",comm:v=>"عمولتك 7%: AED "+v,cashPill:(v,d)=>"كاش "+v+" (خصم "+d+"%)",
  details:"جدول الدفعات",total:"المجموع",save:"التوفير عن السعر الأصلي",
  plan2:"المخطط",copy:"نسخ للعميل",wa:"اسأل سام",copied:"انتسخت. الصقها للعميل.",copyFail:"ما زبط النسخ على هالجهاز.",
  floor:"الطابق",sqft:"قدم²",handover:"التسليم",
  foot:"الأسعار بالدرهم من آخر قوائم إيمان. الأقساط محسوبة على السعر بعد الخصم. الأسعار والتوفر والعروض بتتأكد عند الحجز، ورسوم الأراضي والتسجيل مش محسوبة.",
  waMsg:(u,p)=>"مرحبا سام، الوحدة "+u+" بمشروع "+p+" لسا متاحة؟ عندي عميل إلها."}
};
T.ar.n=k=>k===1?"وحدة":k===2?"وحدتين":k+" وحدات";
const TYPE={"one bedroom":"1 BR","one bedroom with study":"1 BR + Study","two bedroom":"2 BR","two bedroom with study":"2 BR + Study",
 "two bedroom with maid":"2 BR + Maid","three bedroom with study":"3 BR + Study","three bedroom with maid":"3 BR + Maid",
 "four bedroom duplex with pool":"4 BR Duplex + Pool",studio:"Studio",retail:"Retail shop"};
const TYPE_AR={"1 BR":"غرفة نوم","1 BR + Study":"غرفة + مكتب","2 BR":"غرفتين نوم","2 BR + Study":"غرفتين + مكتب","2 BR + Maid":"غرفتين + خادمة",
 "3 BR + Study":"3 غرف + مكتب","3 BR + Maid":"3 غرف + خادمة","4 BR Duplex + Pool":"دوبلكس 4 غرف + مسبح",Studio:"ستوديو","Retail shop":"محل تجاري"};
const VIEW_AR={Community:"المجمع",Pool:"المسبح",Park:"الحديقة","Pool/Park":"المسبح والحديقة","Pool/Community":"المسبح والمجمع",Roadside:"الشارع"};
const fmt=n=>Math.round(n).toLocaleString("en-US");
const mill=n=>n>=1e6?(Math.round(n/1e4)/100).toString()+"M":Math.round(n/1e3)+"K";
const DEF={budget:null,loc:"any",plan:"any",beds:"any",sort:"price"};
const st={lang:"en",...DEF};
try{const l=localStorage.getItem("finder-lang");if(l==="ar"||l==="en")st.lang=l}catch(e){}

const bedsOf=t=>{t=t.toLowerCase();if(t==="retail")return "r";if(t.startsWith("studio"))return "0";
  for(const [w,n] of [["one",1],["two",2],["three",3],["four",4]])if(t.startsWith(w))return String(n);return "?"};
const U=D.units.map(u=>{const p=D.projects[u.pid];const t=TYPE[u.type.toLowerCase()]||u.type;
  return {...u,p,t,beds:bedsOf(u.type),planName:p.plan,planPrice:u.op*(1-u.disc),cashPrice:u.op*(1-u.cash)}});
const priceFor=(u,plan)=>plan==="cash"?u.cashPrice:u.planPrice;
const priceFrom=(u,plan)=>plan==="any"?Math.min(u.planPrice,u.cashPrice):priceFor(u,plan);

function base(u,s){return (s.loc==="any"||u.p.loc===s.loc)&&(s.plan==="any"||s.plan==="cash"||u.planName===s.plan)&&(s.beds==="any"||u.beds===s.beds)}
function fit(u,s=st){ // "yes", "cash" (only with full cash), "near" (up to 10% over), or null
  if(!base(u,s))return null;const b=s.budget;if(!b)return "yes";
  const p=priceFor(u,s.plan);if(p<=b)return "yes";
  if(s.plan==="any"&&u.cashPrice<=b)return "cash";
  if(p<=b*1.1)return "near";return null}
const countWith=ch=>{const s={...st,...ch};return U.filter(u=>{const f=fit(u,s);return f==="yes"||f==="cash"}).length};

function parseBudget(s){s=(s||"").trim().toLowerCase().replace(/[,\s]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));if(!s)return null;
  const m=s.match(/^([\d.]+)(m|k|مليون|الف|ألف)?/);if(!m)return null;let v=parseFloat(m[1]);if(isNaN(v))return null;
  if(m[2]==="m"||m[2]==="مليون")v*=1e6;else if(m[2])v*=1e3;else if(v<100)v*=1e6;return v}

function chips(el,opts,cur,onPick,cls=""){el.innerHTML="";for(const o of opts){const b=document.createElement("button");b.type="button";
  b.className="chip "+cls+(o.c===0?" zero":"");b.setAttribute("aria-pressed",String(o.v===cur));
  b.innerHTML=`${o.l}${o.c!=null?`<i class="num">${o.c}</i>`:""}${o.h?`<small>${o.h}</small>`:""}`;b.onclick=()=>onPick(o.v);el.append(b)}}

function unitCard(u,f){const L=T[st.lang],ar=st.lang==="ar";
  const cashMain=st.plan==="cash"||f==="cash";
  const main=cashMain?u.cashPrice:u.planPrice;
  const type=ar?(TYPE_AR[u.t]||u.t):u.t;
  const fl=u.floor.replace(/ Floor$/,"").replace(/^Ground$/,ar?"أرضي":"Ground");
  const v=u.view.replace(/ View$/,"");
  const sch=u.p.schedule.map(([pc,en,a])=>`<tr><td>${pc}%</td><td>${ar?a:en}</td><td>AED ${fmt(u.planPrice*pc/100)}</td></tr>`).join("");
  return `<article class="unit">
   <div class="row1"><div><div class="eb">${u.p.name} · ${L.locs[u.p.loc][0]}</div>
     <div class="uh"><h3 dir="ltr">${u.no}</h3><span class="ut">${type}</span></div></div>
    <div class="price"><div class="k">${cashMain?L.cashP:L.planP(u.planName)} · ${L.off(Math.round((cashMain?u.cash:u.disc)*100))}</div>
     <div class="v">AED ${fmt(main)}</div><s class="num">${L.list} ${fmt(u.op)}</s></div></div>
   <div class="meta"><span>${L.floor} <b>${fl}</b></span><span><b>${ar?(VIEW_AR[v]||v):v}</b></span><span><b class="num">${fmt(u.area)}</b> ${L.sqft}</span>${u.p.handover?`<span>${L.handover} <b>${u.p.handover}</b></span>`:""}</div>
   <div class="pills">${f==="cash"?`<span class="pill warn">${L.onlyCash}</span>`:""}
    ${!cashMain?`<span class="pill cash num">${L.cashPill(fmt(u.cashPrice),Math.round(u.cash*100))}</span>`:""}
    <span class="pill comm num">${L.comm(fmt(main*COMM))}</span></div>
   ${!cashMain?`<details><summary>${L.details} (${u.planName})</summary><table class="sch"><tbody>${sch}
     <tr class="tot"><td></td><td>${L.total}</td><td>AED ${fmt(u.planPrice)}</td></tr></tbody></table></details>`:""}
   <div class="acts">${u.img?`<button type="button" class="btn" data-plan="${u.pid}|${u.no}">${L.plan2}</button>`:""}
    <button type="button" class="btn" data-copy="${u.pid}|${u.no}">${L.copy}</button>
    <a class="btn wa" href="https://wa.me/${WA}?text=${encodeURIComponent(L.waMsg(u.no,u.p.name))}" target="_blank" rel="noopener">${L.wa}</a></div>
  </article>`}

function render(){const L=T[st.lang];
  document.documentElement.lang=st.lang;document.documentElement.dir=L.dir;
  for(const k of ["h1","sub","role","ask","budget","loc","plan","beds"])document.getElementById("t-"+k).textContent=L[k];
  const nt=document.getElementById("note");nt.hidden=!D.note;document.getElementById("notetext").textContent=D.note;document.getElementById("t-note").textContent=L.noteL;
  document.getElementById("lang").textContent=L.other;document.getElementById("reset").textContent=L.reset;
  document.getElementById("edit").textContent=L.edit;
  const clr=document.getElementById("clear");clr.textContent=L.clear;clr.hidden=!st.budget;
  chips(document.getElementById("quick"),[1,1.5,2,3,4,6].map(m=>({v:m*1e6,l:L.upTo+m+"M"})),st.budget,v=>{st.budget=st.budget===v?null:v;
    document.getElementById("budget").value=st.budget?fmt(st.budget):"";render()},"sm");
  chips(document.getElementById("locs"),[{v:"any",l:L.any,c:countWith({loc:"any"})},
    ...Object.keys(L.locs).map(k=>({v:k,l:L.locs[k][0],h:L.locs[k][1],c:countWith({loc:k})}))],st.loc,v=>{st.loc=v;render()});
  const planOpts=[...new Set(U.map(u=>u.planName))].sort();
  chips(document.getElementById("plans"),[{v:"any",l:L.any,c:countWith({plan:"any"})},...planOpts.map(p=>({v:p,l:p,h:L.planHint[p],c:countWith({plan:p})})),
    {v:"cash",l:L.cash,h:L.planHint.cash,c:countWith({plan:"cash"})}],st.plan,v=>{st.plan=v;render()});
  const bedKeys=["0","1","2","3","4","r"].filter(k=>U.some(u=>u.beds===k));
  chips(document.getElementById("beds"),[{v:"any",l:L.any,c:countWith({beds:"any"})},...bedKeys.map(k=>({v:k,l:L.bedsL[k],c:countWith({beds:k})}))],st.beds,v=>{st.beds=v;render()},"sm");
  const sel=document.getElementById("sort");sel.innerHTML=Object.entries(L.sort).map(([k,t])=>`<option value="${k}"${k===st.sort?" selected":""}>${t}</option>`).join("");

  const key=r=>st.sort==="size"?-r.u.area:(st.sort==="priceD"?-1:1)*(r.f==="cash"?r.u.cashPrice:priceFor(r.u,st.plan));
  const rows=U.map(u=>({u,f:fit(u)})).filter(r=>r.f).sort((a,b)=>key(a)-key(b));
  const yes=rows.filter(r=>r.f!=="near"),near=rows.filter(r=>r.f==="near");
  document.getElementById("count").textContent=L.n(yes.length);
  const bits=[st.budget?L.upTo+"AED "+mill(st.budget):L.anyBudget];
  if(st.loc!=="any")bits.push(L.locs[st.loc][0]);if(st.plan!=="any")bits.push(st.plan==="cash"?L.cash:st.plan);if(st.beds!=="any")bits.push(L.bedsL[st.beds]);
  const [y,m,d]=D.date.split("-");
  document.getElementById("sumline").textContent=bits.join(" · ")+"  ·  "+L.asof(`${d}.${m}.${y}`);
  let html=yes.map(r=>unitCard(r.u,r.f)).join("");
  if(!yes.length){const pool=U.filter(u=>base(u,st));const low=pool.length?Math.min(...pool.map(u=>priceFor(u,st.plan==="any"?"cash":st.plan))):null;
    html=`<div class="empty">${L.none}${low&&st.budget?`<button type="button" class="btn" id="raise" data-v="${Math.ceil(low/5e4)*5e4}">${L.showCheapest(fmt(Math.ceil(low/5e4)*5e4))}</button>`:""}
      <button type="button" class="reset" data-reset="1">${L.reset}</button></div>`}
  if(near.length)html+=`<div class="sec">${L.near}</div>`+near.map(r=>unitCard(r.u,r.f)).join("");
  document.getElementById("list").innerHTML=html;
  document.getElementById("foot").innerHTML=`${L.foot}<br><b>Sam Jabr</b> · Senior Sales Manager · IMAN Developers · <span dir="ltr">+971 50 175 2771</span>`;
}

const find=k=>{const [pid,no]=k.split("|");return U.find(u=>u.pid===pid&&u.no===no)};
function clientText(u){const L=T[st.lang];
  const lines=[`${u.p.name} · ${T.en.locs[u.p.loc][0]}`,`Unit ${u.no} · ${u.t} · ${u.floor} · ${u.view} · ${fmt(u.area)} sq ft`];
  if(st.plan!=="cash"){lines.push(`${u.planName} payment plan, ${Math.round(u.disc*100)}% off: AED ${fmt(u.planPrice)}`);
    for(const [pc,en] of u.p.schedule)lines.push(`  ${pc}% ${en}: AED ${fmt(u.planPrice*pc/100)}`)}
  lines.push(`Full cash, ${Math.round(u.cash*100)}% off: AED ${fmt(u.cashPrice)}`);
  if(u.p.handover)lines.push(`Handover ${u.p.handover}`);
  lines.push("","Sam Jabr · Senior Sales Manager · IMAN Developers · WhatsApp +971 50 175 2771");return lines.join("\n")}
let tt;function toast(s){const t=document.getElementById("toast");t.textContent=s;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
const bi=document.getElementById("budget");
function resetAll(){Object.assign(st,DEF);bi.value="";render()}

document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.plan){const u=find(b.dataset.plan);document.getElementById("dt").textContent=`${u.p.name} · ${u.no}`;
    document.getElementById("di").src=u.img;document.getElementById("dlg").showModal()}
  if(b.dataset.copy){const s=clientText(find(b.dataset.copy));
    try{navigator.clipboard.writeText(s).then(()=>toast(T[st.lang].copied),()=>toast(T[st.lang].copyFail))}catch(err){toast(T[st.lang].copyFail)}}
  if(b.id==="raise"){st.budget=+b.dataset.v;bi.value=fmt(st.budget);render()}
  if(b.dataset.reset)resetAll()});
document.getElementById("dx").onclick=()=>document.getElementById("dlg").close();
document.getElementById("dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});
bi.addEventListener("input",()=>{st.budget=parseBudget(bi.value);render()});
bi.addEventListener("blur",()=>{if(st.budget)bi.value=fmt(st.budget)});
document.getElementById("clear").onclick=()=>{st.budget=null;bi.value="";render();bi.focus()};
document.getElementById("reset").onclick=resetAll;
document.getElementById("sort").onchange=e=>{st.sort=e.target.value;render()};
document.getElementById("edit").onclick=()=>document.getElementById("f").scrollIntoView({behavior:"smooth",block:"start"});
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();bi.blur();document.getElementById("rbar").scrollIntoView({behavior:"smooth"})});
document.getElementById("lang").onclick=()=>{st.lang=st.lang==="en"?"ar":"en";try{localStorage.setItem("finder-lang",st.lang)}catch(e){}render()};
render();
</script>
